name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  # End-to-end on a real Postgres 16: short workload -> snapshots -> dataset -> local train/eval.
  smoke:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: shop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinel -d shop" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: enable pg_stat_statements (service containers can't take a custom command)
        env:
          PGPASSWORD: sentinel
        run: |
          psql -h localhost -U sentinel -d shop -c "ALTER SYSTEM SET shared_preload_libraries = 'pg_stat_statements'"
          docker restart $(docker ps -q --filter ancestor=postgres:16)
          until pg_isready -h localhost -U sentinel; do sleep 1; done
          psql -h localhost -U sentinel -d shop -f db/init.sql
      - run: python scripts/smoke.py --minutes 6
